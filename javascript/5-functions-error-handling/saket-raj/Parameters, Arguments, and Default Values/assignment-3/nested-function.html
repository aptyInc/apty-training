<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Functions with Default Values</title>
  </head>
  <body>
    <h1>
      Nested function setup where the outer function calculates the perimeter of
      a rectangle using default values for length and width
    </h1>
    <label for="length">Enter length :</label>
    <input type="number" id="length" name="length" placeholder="eg: 4" /><br />
    <label for="width">Enter width :</label>
    <input type="number" id="width" name="width" placeholder="eg: 6" /><br />
    <button onclick="areaAndPerimeter()">Calculate</button>
    <p id="output"></p>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
