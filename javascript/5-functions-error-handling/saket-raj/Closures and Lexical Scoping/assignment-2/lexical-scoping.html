<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lexical Scoping in Nested Functions</title>
  </head>
  <body>
    <h1>Lexical Scoping in Nested Functions</h1>

    <label for="first">Enter First Name:</label>
    <input type="text" id="first" placeholder="e.g. John" /><br /><br />

    <label for="middle">Enter Middle Name:</label>
    <input type="text" id="middle" placeholder="e.g. D." /><br /><br />

    <label for="last">Enter Last Name:</label>
    <input type="text" id="last" placeholder="e.g. Doe" /><br /><br />

    <button onclick="showFullName()">Get Full Name</button>

    <p id="output"></p>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
