<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repeat Action Example</title>
</head>

<body>

    <h2>Create a List Using Higher-Order Function</h2>

    <label>Enter number of items:</label>
    <input type="number" id="itemCount" placeholder="e.g. 5">

    <br><br>

    <label>Enter item text:</label>
    <input type="text" id="itemText" placeholder="e.g. Hello">

    <br><br>

    <button onclick="generateList()">Generate List</button>

    <ul id="outputList"></ul>

    <script src="./scripts/index.js"></script>
</body>

</html>
