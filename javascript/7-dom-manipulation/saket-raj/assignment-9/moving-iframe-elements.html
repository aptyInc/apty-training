<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving Rows inside iFrame (External Controls)</title>
    <link rel="stylesheet" href="./Styles/style.css" />
  </head>
  <body>
    <h1>Control Table Rows inside iFrame</h1>

    <iframe
      id="myFrame"
      style="width: 80%; height: 400px; border: 1px solid #ccc"
    ></iframe>

    <div id="controls" style="margin-top: 20px">
      <label for="rowSelect">Select Row:</label>
      <select id="rowSelect"></select>
      <button id="upBtn">Up</button>
      <button id="downBtn">Down</button>
      <button id="topBtn">Top</button>
      <button id="bottomBtn">Bottom</button>
    </div>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
