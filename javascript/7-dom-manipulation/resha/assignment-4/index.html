<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Element Count</title>
</head>

<body>

    <div>Div 1</div>
    <div>Div 2</div>
    <p>Paragraph 1</p>
    <p><em>Paragraph 2</em></p>
    <p>Paragraph 3</p>
    <span>Span 1</span><br>
    <span>Span 2</span><br><br>
    <a href="#">Link 1</a><br>
    <a href="#">Link 2</a><br><br>

    <button id="countElements">Count Elements</button>

    <p id="output"></p>

    <script src="./scripts/script.js"></script>
</body>

</html>
