<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Nested Element Count</title>
</head>

<body>
    <h2>Display Nested Element Count</h2>

    <div>
        <p>Paragraph inside Div 1</p>
        <span>Span inside Div 1</span>
        <div>
            <p>Paragraph inside another div</p>
        </div>
    </div>

    <div>
        <p>Paragraph inside Div 2</p>
        <span>Span inside Div 2</span>
    </div>

    <p>
        Paragraph 1
        <span>Span inside Paragraph</span>
    </p><br><br>

    <button id="count">Count Elements</button>

    <ul id="output"></ul>

    <script src="./scripts/script.js"></script>
</body>

</html>
