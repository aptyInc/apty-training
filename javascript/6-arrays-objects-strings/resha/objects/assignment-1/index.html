<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Key Object</title>
</head>

<body>
    <div>
        <h2>Dynamic Key Object</h2>
        <label for="key">Enter key:</label><br>
        <input type="text" id="key"><br><br>

        <label for="val">Enter value:</label><br>
        <input type="text" id="val"><br><br>

        <button id="show">Show</button><br>

        <p id="output"></p>
    </div>
    <script src="./scripts/script.js"></script>
</body>

</html>
