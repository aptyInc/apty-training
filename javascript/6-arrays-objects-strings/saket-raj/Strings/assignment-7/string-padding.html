<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String padding</title>
  </head>
  <body>
    <h1>
      Function that takes a string and returns the string padded with zeros to
      ensure that it has a length of 10.
    </h1>
    <label for="string">Enter a string :</label>
    <input type="text" name="string" id="string" placeholder="eg : 123" /><br />
    <button onclick="stringPadding()">Padding</button>
    <p id="result"></p>
    <script src="./Scripts/index.js"></script>
  </body>
</html>
