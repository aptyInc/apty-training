<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Sequences</title>
  </head>
  <body>
    <h1>
      Function that takes a string and returns a new string where every instance
      of '\n' and '\t' are replaced with their respective escape sequences.
    </h1>
    <label for="word">Enter a string :</label>
    <input
      type="text"
      name="word"
      id="word"
      placeholder="eg: Hello\nWorld\t!"
    />
    <br />
    <button onclick="escapeSequences()">REPLACE</button>
    <p id="result"></p>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
