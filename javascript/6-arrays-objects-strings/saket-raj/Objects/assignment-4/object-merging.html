<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object Merging</title>
  </head>
  <body>
    <h1>
      Merge two objects, overwriting properties in the first with those from the
      second (supports deep merge).
    </h1>

    <label for="obj1">Enter first object:</label><br />
    <textarea
      id="obj1"
      rows="5"
      cols="40"
      placeholder='e.g. {"a": 1, "b": {"x": 10}}'
    ></textarea
    ><br />

    <label for="obj2">Enter second object:</label><br />
    <textarea
      id="obj2"
      rows="5"
      cols="40"
      placeholder='e.g. {"b": {"y": 20}, "c": 3}'
    ></textarea
    ><br />

    <button onclick="mergeObjects()">MERGE OBJECTS</button>
    <p id="result"></p>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
