  <head>

    <title>Find the Most Frequent Element from an Array</title>

  <body>
    <h1>Find the Most Frequent Element from an Array</h1>
    <label for="array">Enter an array(comma seperated) :</label>

      type="text"
      placeholder="example : 1,2,3,4,4,5"
      name="array"
      id="array"
    /><br />
    <button onclick="mostFrequency()">FIND</button>
    <p id="result"></p>
