<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Dimensional Array Operations</title>
    <style>
      body {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>
      A function transposeMatrix(matrix) that takes a 2D array (matrix) and
      returns its transpose.
    </h1>
    <label for="array">Enter a 2D matrix :</label><br />
    <textarea
      name="array"
      id="array"
      rows="7"
      placeholder="eg: [
[1, 2, 3],
[4, 5, 6],
[7, 8, 9]
]"
    ></textarea
    ><br />
    <button onclick="transposeMatrix()">Transpose</button>
    <div id="result"></div>
    <script src="./Scripts/index.js"></script>
  </body>
</html>
