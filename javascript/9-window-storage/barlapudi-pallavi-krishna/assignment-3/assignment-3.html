<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Scrolling</title>
    <meta charset="UTF-8" />
    <script src="scripts/script.js" defer></script>
  </head>
  <body>
    <div style="height: 2000px; background: linear-gradient(white, lightblue)">
      <h2>Scroll Demo</h2>

      <label for="xVal">X: </label>
      <input type="number" id="xVal" value="0" />
      <label for="yVal">Y:</label>
      <input type="number" id="yVal" value="0" />
      <button id="scrollToBtn">Scroll To</button>
      <br /><br />
      <button id="scrollUp">Scroll Up 10px</button>
      <button id="scrollDown">Scroll Down 10px</button>
    </div>
  </body>
</html>
