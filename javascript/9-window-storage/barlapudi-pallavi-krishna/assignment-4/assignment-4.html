<!DOCTYPE html>
<html lang="en">
<head>
  <title>Countdown & Stopwatch</title>
  <meta charset="UTF-8"/>
  <script src="scripts/script.js" defer></script>
</head>
<body>
  <h2>Countdown Timer</h2>
  <label for="countdownInput">Seconds:</label>
  <input type="number" id="countdownInput" value="10">
  <button id="startCountdown">Start Countdown</button>
  <p id="countdownDisplay">Time left: 10s</p>
  <hr>
  <h2>Stopwatch</h2>
  <p id="stopwatchDisplay">0s</p>
  <button id="startStopwatch">Start</button>
  <button id="stopStopwatch">Stop</button>
  <button id="resetStopwatch">Reset</button>
</body>
</html>
