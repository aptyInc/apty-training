<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling</title>
    <style>
        body{
            width: 5000px;
            height: 5000px;
        }
    </style>
</head>

<body>
    <div>
        <label for="xInput">Enter value for x:</label><br>
        <input type="number" id="xInput"><br><br>

        <label for="yInput">Enter value for y:</label><br>
        <input type="number" id="yInput"><br><br>

        <button id="scroll">Scroll</button>

        <h5>Scroll up and down 10px:</h5>
        <button id="scrollUp">Scroll Up</button><br><br>
        <button id="scrollDown">Scroll Down</button>
    </div>

    <script src="./scripts/script.js"></script>
</body>

</html>
