<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timers</title>
</head>

<body>
    <div>
        <h2>Timers</h2>

        <h4>Countdown:</h4>
        <label for="time">Enter seconds:</label><br>
        <input type="number" id="time"><br>

        <p id="countOp"></p>
        <button id="startCD">Start</button>&nbsp;
        <button id="stopCD">Stop</button>

        <h4>Stopwatch:</h4>
        <p id="stopwatchOp">Stopwatch Time: 0sec</p>
        <button id="startSW">Start</button>&nbsp;
        <button id="stopSW">Stop</button>&nbsp;
        <button id="resetSW">Reset</button>
    </div>
    
    <script src="./scripts/script.js"></script>
</body>

</html>
