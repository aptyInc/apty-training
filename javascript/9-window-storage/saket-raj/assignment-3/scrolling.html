<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrolling Example</title>
    <style>
      body {
        width: 1800px;
        height: 3000px;
      }

      .controls {
        position: fixed;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label for="xPos">X:</label>
      <input type="number" id="xPos" value="0" />
      <label for="yPos">Y:</label>
      <input type="number" id="yPos" value="0" />
      <button onclick="scrollToPosition()">Scroll to Position</button>
      <br />
      <button onclick="scrollUp()">Scroll Up 10px</button>
      <button onclick="scrollDown()">Scroll Down 10px</button>
    </div>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
