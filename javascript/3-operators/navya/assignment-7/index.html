<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitwise Operators App</title>
</head>

<body>
    <h2>Bitwise Operators</h2>

    <label for="v1">Value 1:</label>
    <input type="number" id="v1" />
    <br><br>

    <label for="v2">Value 2:</label>
    <input type="number" id="v2" />
    <br><br>

    <button onclick="andOp()">&amp; (AND)</button>
    <button onclick="orOp()">| (OR)</button>
    <button onclick="xorOp()">^ (XOR)</button>
    <button onclick="notOp()">~ (NOT)</button>
    <button onclick="lshiftOp()">&laquo;&laquo; (Left Shift)</button>
    <button onclick="rshiftOp()">&raquo;&raquo; (Right Shift)</button>

    <h3 id="out"></h3>

    <script src="./scripts/index.js"></script>
</body>

</html>
