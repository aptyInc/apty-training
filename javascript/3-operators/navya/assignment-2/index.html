<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators Demo</title>
</head>

<body>

    <div class="inputs">
        <input type="number" id="val1" placeholder="Enter First Value">
        <input type="number" id="val2" placeholder="Enter Second Value">
    </div>

    <div id="buttons" style="margin-top: 15px;">
        <button onclick="add()">+=</button>
        <button onclick="subtract()">-=</button>
        <button onclick="multiply()">*</button>
        <button onclick="divide()">/=</button>
        <button onclick="modulus()">%=</button>
        <button onclick="increment()">++</button>
        <button onclick="decrement()">--</button>
    </div>

    <div id="output" style="margin-top: 20px; font-weight: 600;"></div>

    <script src="./scripts/index.js"></script>
</body>

</html>
