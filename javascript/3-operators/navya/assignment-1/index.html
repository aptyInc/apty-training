<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Arithmetic App</title>
</head>

<body>
    <div class="number-inputs">
        <label for="numA">Enter First Number: </label>
        <input type="number" id="numA" />

        <label for="numB">Enter Second Number: </label>
        <input type="number" id="numB" />
    </div>

    <br />

    <div id="calcActions">
        <button onclick="doAdd()">+</button>
        <button onclick="doSubtract()">-</button>
        <button onclick="doMultiply()">*</button>
        <button onclick="doDivide()">/</button>
        <button onclick="doModulo()">%</button>
        <button onclick="increase()">++</button>
        <button onclick="decrease()">--</button>
    </div>

    <br />

    <div id="resultBox"></div>

    <script src="./scripts/index.js"></script>
</body>

</html>
