<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitwise Operators App</title>
  </head>
  <body>
    <h2>Bitwise Operators App</h2>

    <label>Value 1:</label>
    <input type="number" id="value1" /><br />

    <label>Value 2:</label>
    <input type="number" id="value2" /><br />

    <button onclick="andOperator()">&</button>
    <button onclick="orOperator()">|</button>
    <button onclick="xorOperator()">^</button>
    <button onclick="notOperator()">~ (NOT)</button>
    <button onclick="leftShiftOperator()"><< (Left Shift)</button>
    <button onclick="rightShiftOperator()">>> (Right Shift)</button>

    <h3 id="result"></h3>

    <script src="./Scripts/index.js"></script>
  </body>
</html>
